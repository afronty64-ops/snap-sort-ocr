<style>
  :root{
    --bg:#f6f5f2; --panel:#ffffff; --ink:#1c1b19; --sub:#6b6862;
    --accent:#c15f3c; --accent-ink:#ffffff; --line:#e6e3dc; --chip:#efece5;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171614; --panel:#211f1c; --ink:#f1efe9; --sub:#a39d92;
      --accent:#e2825a; --accent-ink:#1c1b19; --line:#34312b; --chip:#2b2925;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171614; --panel:#211f1c; --ink:#f1efe9; --sub:#a39d92;

    margin:0; background:var(--bg); color:var(--ink);

    min-height:100%; padding:20px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:1.4rem;margin:4px 0 2px;}
  p.sub{color:var(--sub);margin:0 0 18px;font-size:.92rem;}

    border:2px dashed var(--line); border-radius:12px; padding:26px 14px; text-align:center;

  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;}

  .btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}

    font:inherit; border:none; border-radius:10px; padding:10px 16px; cursor:pointer;

<body>
<div class="wrap">
  <h1>📸 Snap &amp; Sort OCR</h1>
  <p class="sub">Add photos, pull the text out, and let it group itself by topic. Then send it to your computer.</p>

  <div class="card">
    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      Tap to add photos<br><span style="font-size:.8rem">(camera or gallery, add as many as you like)</span>
    </label>
    <div class="thumbs" id="thumbs"></div>
    <div class="opts">
      <label>Mode
        <select id="modeSel">
          <option value="numbers">Numbers &amp; codes (SIM cards, serials)</option>
          <option value="text">Text (notes, documents)</option>
        </select>
      </label>
      <label>Language
        <select id="langSel">
          <option value="eng">English</option>
          <option value="nor">Norwegian</option>
          <option value="eng+nor">English + Norwegian</option>
          <option value="swe">Swedish</option>
          <option value="dan">Danish</option>
          <option value="deu">German</option>
          <option value="fra">French</option>
          <option value="spa">Spanish</option>
        </select>
      </label>
      <label><input type="checkbox" id="enhanceChk" checked> Enhance image (recommended)</label>
    </div>
    <div class="btnrow">
      <button class="primary" id="runBtn" disabled>Extract &amp; sort text</button>
      <button id="clearBtn" style="display:none">Clear</button>
    </div>
    <div class="status" id="status"></div>
    <progress id="progress" value="0" max="1" style="display:none"></progress>
  </div>

  <div id="results"></div>

  <div class="card" id="exportCard" style="display:none">
    <div class="btnrow">
      <button class="primary" id="saveBtn">💾 Save .txt to this device</button>
      <button id="copyBtn">📋 Copy all text</button>
    </div>
    <p class="sub" style="margin-top:10px;margin-bottom:0">
      On a phone, open this same page link in your PC's browser (or use Save/Copy above) to get the text onto your computer.
    </p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const thumbs = document.getElementById('thumbs');
const runBtn = document.getElementById('runBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progress');
const resultsEl = document.getElementById('results');
const exportCard = document.getElementById('exportCard');
const saveBtn = document.getElementById('saveBtn');
const copyBtn = document.getElementById('copyBtn');
const toastEl = document.getElementById('toast');

let files = [];
let groups = null; // [{category, items:[{filename, text}]}]

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

fileInput.addEventListener('change', ()=>{
  const picked = Array.from(fileInput.files || []);
  if(!picked.length) return;
  files = files.concat(picked);
  renderThumbs();
  statusEl.textContent = `${files.length} photo${files.length===1?'':'s'} ready — tap "Extract & sort text".`;
  setTimeout(()=>{ try{ fileInput.value=''; }catch(e){} }, 500);   // allow picking the same photo again
});

function renderThumbs(){
  thumbs.innerHTML = '';
  files.forEach(f=>{
    const div = document.createElement('div');
    div.className = 'thumb';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    div.appendChild(img);
    thumbs.appendChild(div);
  });
  runBtn.disabled = files.length === 0;
  clearBtn.style.display = files.length ? 'inline-block' : 'none';
}

clearBtn.addEventListener('click', ()=>{
  files = [];
  groups = null;
  renderThumbs();
  resultsEl.innerHTML = '';
  exportCard.style.display = 'none';
  statusEl.textContent = '';
  progressEl.style.display = 'none';
});

async function preprocess(file){
  const bmp = await loadImg(file);
  // Tesseract works best when text is ~25-35px tall; normalise size
  let scale = 2400 / Math.max(bmp.width, bmp.height);
  scale = Math.min(Math.max(scale, 0.4), 3);
  const w = Math.round(bmp.width*scale), h = Math.round(bmp.height*scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  ctx.drawImage(bmp, 0, 0, w, h);
  const img = ctx.getImageData(0,0,w,h);
  const d = img.data, n = w*h;
  const gray = new Uint8ClampedArray(n);
  for(let i=0;i<n;i++){
    gray[i] = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2];
  }
  // integral image for local (adaptive) mean -> copes with shadows / uneven light
  const W = w+1;
  const integ = new Float64Array(W*(h+1));
  for(let y=1;y<=h;y++){
    let row=0;
    for(let x=1;x<=w;x++){
      row += gray[(y-1)*w+(x-1)];
      integ[y*W+x] = integ[(y-1)*W+x] + row;
    }
  }
  const r = Math.max(15, Math.round(Math.min(w,h)/24));
  for(let y=0;y<h;y++){
    const y0=Math.max(0,y-r), y1=Math.min(h,y+r+1);
    for(let x=0;x<w;x++){
      const x0=Math.max(0,x-r), x1=Math.min(w,x+r+1);
      const sum = integ[y1*W+x1]-integ[y0*W+x1]-integ[y1*W+x0]+integ[y0*W+x0];
      const mean = sum/((x1-x0)*(y1-y0));
      const v = gray[y*w+x] < mean*0.88 ? 0 : 255;
      const k=(y*w+x)*4;
      d[k]=d[k+1]=d[k+2]=v; d[k+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return c;
}

function cleanText(data){
  // drop low-confidence / symbol-only lines (usually noise from textures, borders, photos)
  if(Array.isArray(data.lines) && data.lines.length){
    const good = data.lines.filter(l=>{
      const t=(l.text||'').trim();
      const alnum=(t.match(/[\p{L}\p{N}]/gu)||[]).length;
      const hasDigit=/\p{N}/u.test(t);
      // be lenient with anything containing digits (prices, dates, phone numbers, single digits)
      if(hasDigit) return t.length>0 && (l.confidence===undefined || l.confidence>=20);
      return alnum>=2 && alnum/t.length>0.5 && (l.confidence===undefined || l.confidence>=40);
    }).map(l=>l.text.trim());
    return good.join('\n');
  }
  return (data.text||'').trim();
}


// ---------- Numbers & codes mode ----------
function luhnOk(d){
  let sum=0, alt=false;
  for(let i=d.length-1;i>=0;i--){
    let n=+d[i]; if(alt){ n*=2; if(n>9) n-=9; } sum+=n; alt=!alt;
  }
  return sum%10===0;
}

function grayCanvas(bmp, longSide){
  const sc = longSide/Math.max(bmp.width,bmp.height);
  const w=Math.round(bmp.width*sc), h=Math.round(bmp.height*sc);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(bmp,0,0,w,h);
  const img=ctx.getImageData(0,0,w,h), d=img.data, n=w*h;
  const g=new Uint8ClampedArray(n), hist=new Uint32Array(256);
  for(let i=0;i<n;i++){ const v=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]; g[i]=v; hist[v|0]++; }
  let acc=0, lo=0, hi=255;
  for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>n*0.01){lo=v;break;} }
  acc=0;
  for(let v=255;v>=0;v--){ acc+=hist[v]; if(acc>n*0.01){hi=v;break;} }
  const span=Math.max(1,hi-lo);
  for(let i=0;i<n;i++){
    const v=Math.max(0,Math.min(255,(g[i]-lo)*255/span));
    d[i*4]=d[i*4+1]=d[i*4+2]=v; d[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
  return c;
}

function findDigitBlocks(g,w,h){
  const W=w+1, integ=new Int32Array(W*(h+1));
  for(let y=1;y<=h;y++){
    let row=0;
    for(let x=1;x<=w;x++){ row+=g[(y-1)*w+(x-1)]; integ[y*W+x]=integ[(y-1)*W+x]+row; }
  }
  const r=30, ink=new Uint8Array(w*h);
  for(let y=0;y<h;y++){
    const y0=Math.max(0,y-r), y1=Math.min(h,y+r+1);
    for(let x=0;x<w;x++){
      const x0=Math.max(0,x-r), x1=Math.min(w,x+r+1);
      const sum=integ[y1*W+x1]-integ[y0*W+x1]-integ[y1*W+x0]+integ[y0*W+x0];
      if(g[y*w+x] < sum/((x1-x0)*(y1-y0))*0.94) ink[y*w+x]=1;
    }
  }
  // label connected ink pieces (4-connected), keep digit-sized ones
  const seen=new Uint8Array(w*h), comps=[], stack=[];
  for(let s=0;s<w*h;s++){
    if(!ink[s]||seen[s]) continue;
    let minx=w,maxx=0,miny=h,maxy=0,cnt=0;
    stack.length=0; stack.push(s); seen[s]=1;
    while(stack.length){
      const p=stack.pop(), px=p%w, py=(p-px)/w;
      cnt++;
      if(px<minx)minx=px; if(px>maxx)maxx=px; if(py<miny)miny=py; if(py>maxy)maxy=py;
      if(px>0&&ink[p-1]&&!seen[p-1]){seen[p-1]=1;stack.push(p-1);}
      if(px<w-1&&ink[p+1]&&!seen[p+1]){seen[p+1]=1;stack.push(p+1);}
      if(py>0&&ink[p-w]&&!seen[p-w]){seen[p-w]=1;stack.push(p-w);}
      if(py<h-1&&ink[p+w]&&!seen[p+w]){seen[p+w]=1;stack.push(p+w);}
    }
    const ch=maxy-miny+1, cw=maxx-minx+1, lg=Math.max(ch,cw), sh=Math.min(ch,cw);
    if(lg>=16&&lg<=70&&sh>=4&&cnt>=30) comps.push({x0:minx,x1:maxx,y0:miny,y1:maxy,h:lg});
  }
  // cluster neighbouring digit-sized pieces into text blocks
  const par=comps.map((_,i)=>i);
  const find=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i];}return i;};
  for(let i=0;i<comps.length;i++){
    const a=comps[i];
    for(let j=i+1;j<comps.length;j++){
      const b=comps[j], hh=Math.max(a.h,b.h), ratio=a.h/b.h;
      if(ratio<0.65||ratio>1.55) continue;
      const gx=Math.max(0,Math.max(a.x0,b.x0)-Math.min(a.x1,b.x1));
      const gy=Math.max(0,Math.max(a.y0,b.y0)-Math.min(a.y1,b.y1));
      if(gx<0.7*hh && gy<0.9*hh) par[find(i)]=find(j);
    }
  }
  const groups={};
  comps.forEach((c,i)=>{(groups[find(i)]=groups[find(i)]||[]).push(c);});
  const blocks=[];
  Object.values(groups).forEach(gr=>{
    if(gr.length<10) return;
    const hs=gr.map(c=>c.h).sort((a,b)=>a-b), med=hs[hs.length>>1];
    if(gr.filter(c=>Math.abs(c.h-med)<0.25*med).length < 0.7*gr.length) return;
    blocks.push({x0:Math.min(...gr.map(c=>c.x0)), x1:Math.max(...gr.map(c=>c.x1)),
                 y0:Math.min(...gr.map(c=>c.y0)), y1:Math.max(...gr.map(c=>c.y1)), hmed:med, cnt:gr.length,
                 pts:gr.map(c=>[(c.x0+c.x1)/2,(c.y0+c.y1)/2]),
                 cx:gr.reduce((a,c)=>a+(c.x0+c.x1)/2,0)/gr.length, cy:gr.reduce((a,c)=>a+(c.y0+c.y1)/2,0)/gr.length});
  });
  return blocks.sort((a,b)=>b.cnt-a.cnt).slice(0,20);
}

function assembleBlock(text){
  const ls=(text||'').split(/\n+/).map(l=>l.replace(/\D/g,'')).filter(l=>l.length>=3);
  const out=[];
  for(let i=0;i<ls.length;i++){
    if(ls[i].startsWith('89')){
      if(ls[i].length>=18){ out.push({n:ls[i].slice(0,20),kind:'sim'}); continue; }
      const num=ls.slice(i,i+4).join('');
      if(ls.length-i>=4 && num.length>=18 && num.length<=22) out.push({n:num,kind:'sim'});
      else if(num.length>=10) out.push({n:num,kind:'partial'});
      i+=3;
    }
  }
  if(!out.length && ls.length>=3){
    const L=ls.map(l=>l.length);
    if(Math.max(...L)-Math.min(...L)<=1 && L[0]>=4 && ls.join('').length>=10) out.push({n:ls.join(''),kind:'code'});
  }
  return out;
}


function stretchGray(c){
  const ctx=c.getContext('2d',{willReadFrequently:true});
  const img=ctx.getImageData(0,0,c.width,c.height), d=img.data, n=c.width*c.height;
  const g=new Uint8ClampedArray(n), hist=new Uint32Array(256);
  for(let i=0;i<n;i++){ const v=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]; g[i]=v; hist[v|0]++; }
  let acc=0, lo=0, hi=255;
  for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>n*0.001){lo=v;break;} }
  acc=0;
  for(let v=255;v>=0;v--){ acc+=hist[v]; if(acc>n*0.10){hi=v;break;} }
  const span=Math.max(1,hi-lo);
  for(let i=0;i<n;i++){ const v=Math.max(0,Math.min(255,(g[i]-lo)*255/span)); d[i*4]=d[i*4+1]=d[i*4+2]=v; d[i*4+3]=255; }
  ctx.putImageData(img,0,0);
}


function loadImg(file){
  // <img> decoding applies EXIF rotation and works on iOS Safari (createImageBitmap options don't)
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Could not open this image')); };
    img.src=url;
  });
}

function estimateAngle(pts,hmed){
  // direction of nearest-neighbour vectors (digits sit closest to their left/right neighbour)
  let sx=0, sy=0;
  for(let i=0;i<pts.length;i++){
    let bd=1e18, bj=-1;
    for(let j=0;j<pts.length;j++){
      if(i===j) continue;
      const dx=pts[j][0]-pts[i][0], dy=pts[j][1]-pts[i][1], d=dx*dx+dy*dy;
      if(d<bd){bd=d;bj=j;}
    }
    if(bj<0 || Math.sqrt(bd)>1.6*hmed) continue;
    const ang=Math.atan2(pts[bj][1]-pts[i][1], pts[bj][0]-pts[i][0]);
    sx+=Math.cos(2*ang); sy+=Math.sin(2*ang);
  }
  return 0.5*Math.atan2(sy,sx);
}

function renderBlock(img, sc, bl, rot, target, M){
  M = M||0;
  const f=target/bl.hmed, co=Math.cos(-rot), si=Math.sin(-rot);
  let hx=0, hy=0;
  bl.pts.forEach(p=>{
    const dx=p[0]-bl.cx, dy=p[1]-bl.cy;
    hx=Math.max(hx,Math.abs(dx*co-dy*si)); hy=Math.max(hy,Math.abs(dx*si+dy*co));
  });
  hx+=bl.hmed*0.55; hy+=bl.hmed*0.7;
  const tw=Math.max(8,Math.round(2*hx*f)), th=Math.max(8,Math.round(2*hy*f));
  const ow=tw+2*M, oh=th+2*M;
  const c=document.createElement('canvas'); c.width=ow; c.height=oh;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,ow,oh);
  ctx.imageSmoothingQuality='high';
  if(M){ ctx.beginPath(); ctx.rect(M,M,tw,th); ctx.clip(); }   // keep only the digit block; white margin around it
  ctx.scale(f,f); ctx.translate(ow/(2*f),oh/(2*f)); ctx.rotate(-rot);
  ctx.scale(sc,sc); ctx.translate(-bl.cx/sc,-bl.cy/sc);
  ctx.drawImage(img,0,0);
  stretchGray(c);
  return c;
}

async function scanNumbers(worker, file, onFrac){
  const img = await loadImg(file);
  const results=[], seenNums=new Set(), done=[], jobs=[];
  for(const L of [1600,2400]){
    const sc=L/Math.max(img.width,img.height);
    const gc=grayCanvas(img,L), w=gc.width, h=gc.height;
    const d=gc.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
    const g=new Uint8ClampedArray(w*h);
    for(let i=0;i<w*h;i++) g[i]=d[i*4];
    findDigitBlocks(g,w,h).forEach(bl=>jobs.push({bl,sc,L}));
    await new Promise(r=>setTimeout(r,0));
  }
  const readBlock=async (bl,sc,rot,target,M)=>{
    let text='';
    try{ text=(await worker.recognize(renderBlock(img,sc,bl,rot,target,M))).data.text; }catch(e){}
    return assembleBlock(text);
  };
  for(let k=0;k<jobs.length;k++){
    const {bl,sc,L}=jobs[k];
    const nx=bl.cx/L, ny=bl.cy/L;
    if(!done.some(q=>Math.hypot(q[0]-nx,q[1]-ny)<0.03)){
      const th=estimateAngle(bl.pts,bl.hmed);
      const rots=[th, th+Math.PI, th+Math.PI/2, th-Math.PI/2];
      let best=null, bestRot=0, bestM=0, valid=false;
      for(const M of [0,28]){
        for(const rot of rots){
          const found=await readBlock(bl,sc,rot,30,M);
          if(!found.length) continue;
          if(!best){ best=found; bestRot=rot; bestM=M; }
          if(found.some(x=>x.kind==='sim' && luhnOk(x.n))){ best=found; valid=true; break; }
        }
        if(valid) break;
      }
      if(best && !valid){
        for(const t of [24,38]){
          const found=await readBlock(bl,sc,bestRot,t,bestM);
          if(found.some(x=>x.kind==='sim' && luhnOk(x.n))){ best=found; valid=true; break; }
        }
      }
      if(valid) done.push([nx,ny]);
      if(best) best.forEach(x=>{ if(!seenNums.has(x.n)){ seenNums.add(x.n); results.push(x); } });
    }
    onFrac((k+1)/jobs.length);
  }
  const lines=[];
  results.filter(x=>x.kind==='sim').forEach(x=>lines.push(`${x.n}  ${luhnOk(x.n)?'✓':'(check digit fails – verify by eye)'}`));
  results.filter(x=>x.kind==='code').forEach(x=>lines.push(`${x.n}  (code)`));
  results.filter(x=>x.kind==='partial').forEach(x=>lines.push(`${x.n}  (incomplete – retake closer)`));
  return lines.join('\n');
}

async function plainCanvas(file){
  const im=await loadImg(file), sc=Math.min(1, 2400/Math.max(im.width,im.height));
  const c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height); return c;
}
function rotCanvas(c,deg){
  const o=document.createElement('canvas'), q=deg%180!==0;
  o.width=q?c.height:c.width; o.height=q?c.width:c.height;
  const x=o.getContext('2d'); x.translate(o.width/2,o.height/2); x.rotate(deg*Math.PI/180); x.drawImage(c,-c.width/2,-c.height/2);
  return o;
}
runBtn.addEventListener('click', async ()=>{
  runBtn.disabled = true;
  progressEl.style.display = 'block';
  progressEl.value = 0;
  const lang = document.getElementById('langSel').value;
  const enhance = document.getElementById('enhanceChk').checked;
  const mode = document.getElementById('modeSel').value;
  const extracted = [];
  let worker = null;
  let curIdx = 0;
  let lastErr = null;
  try{
    statusEl.textContent = 'Loading OCR engine (first time takes a moment)…';
    worker = await Tesseract.createWorker(mode==='numbers' ? 'eng' : lang, 1, {
      logger: m=>{
        if(m.status==='recognizing text' && mode==='text'){
          progressEl.value = (curIdx + m.progress) / files.length;
        }
      }
    });
    if(mode==='numbers'){
      await worker.setParameters({ tessedit_char_whitelist:'0123456789', tessedit_pageseg_mode:'6', user_defined_dpi:'300' });
    } else {
      await worker.setParameters({ preserve_interword_spaces:'1', user_defined_dpi:'300' });
    }
    for (let i=0; i<files.length; i++){
      curIdx = i;
      statusEl.textContent = `Reading photo ${i+1} of ${files.length}…`;
      const name = files[i].name || `photo-${i+1}`;
      try{
        if(mode==='numbers'){
          const txt = await scanNumbers(worker, files[i], f=>{ progressEl.value=(i+f)/files.length; });
          extracted.push({ filename: name, text: txt });
        } else {
          const input = enhance ? await preprocess(files[i]) : await plainCanvas(files[i]);
          let { data } = await worker.recognize(input);
          if((data.confidence||0) < 60){
            for(const deg of [90,180,270]){
              const r = await worker.recognize(rotCanvas(input,deg));
              if((r.data.confidence||0) > (data.confidence||0) + 5) data = r.data;
            }
          }
          extracted.push({ filename: name, text: cleanText(data) });
        }
      }catch(err){
        lastErr = err;
        extracted.push({ filename: name, text: '' });
      }
    }
  }catch(err){
    statusEl.textContent = 'OCR engine failed to load — check your connection and try again.';
    progressEl.style.display = 'none';
    runBtn.disabled = false;
    return;
  }finally{
    if(worker){ try{ await worker.terminate(); }catch(e){} }
  }
  progressEl.value = 1;
  statusEl.textContent = 'Grouping by topic…';
  groups = mode==='numbers' ? [{category:'Numbers found', items: extracted}] : await categorize(extracted);
  renderResults();
  statusEl.textContent = lastErr ? `Some photos failed: ${lastErr.message||lastErr}. ` : ''; statusEl.textContent += `Done — ${extracted.length} photo${extracted.length===1?'':'s'} processed. If the text looks wrong, try toggling "Enhance image" or the language.`;
  progressEl.style.display = 'none';
  runBtn.disabled = false;
  exportCard.style.display = 'block';
});

async function categorize(items){
  const nonEmpty = items.filter(it=>it.text.length>0);
  if(nonEmpty.length===0) return [{category:'No text found', items}];

  let sample = null;
  try{ sample = await claude.use('sample'); }catch(e){ sample = null; }

  if(sample){
    try{
      const prompt = `Group these OCR'd snippets of text into short topical categories (2-5 words each, e.g. "Recipes", "Meeting notes", "Receipts"). Return ONLY JSON, no prose: an array of objects like {"category": string, "indices": [numbers]} covering every index exactly once, best category first. Items:\n` +
        nonEmpty.map((it,i)=>`[${i}] (${it.filename}): ${it.text.slice(0,400)}`).join('\n\n');
      const parsed = await sample.json(prompt, { modelTier: 'quick' });
      if(Array.isArray(parsed)){
        const used = new Set();
        const out = parsed.map(g=>({
          category: g.category || 'Other',
          items: (g.indices||[]).filter(i=>nonEmpty[i]&&!used.has(i)).map(i=>{used.add(i);return nonEmpty[i];})
        })).filter(g=>g.items.length);
        const leftover = nonEmpty.filter((_,i)=>!used.has(i));
        if(leftover.length) out.push({category:'Other', items: leftover});
        const emptyOnes = items.filter(it=>it.text.length===0);
        if(emptyOnes.length) out.push({category:'No text found', items: emptyOnes});
        return out;
      }
    }catch(e){ /* fall through to local grouping */ }
  }
  return localGroup(items);
}

// Fallback: simple keyword-overlap grouping, no AI needed
function localGroup(items){
  const stop = new Set(['the','and','for','with','this','that','from','have','are','was','were','you','your','of','to','a','in','on','is','it','be','as','at','an']);
  function keywords(text){
    return (text.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!stop.has(w));
  }
  const nonEmpty = items.filter(it=>it.text.length>0);
  const clusters = [];
  nonEmpty.forEach(it=>{
    const kw = new Set(keywords(it.text).slice(0,40));
    let best=null, bestScore=0;
    clusters.forEach(c=>{
      let score=0; kw.forEach(w=>{ if(c.kw.has(w)) score++; });
      if(score>bestScore){bestScore=score;best=c;}
    });
    if(best && bestScore>=2){
      best.items.push(it);
      kw.forEach(w=>best.kw.add(w));
    } else {
      clusters.push({kw, items:[it]});
    }
  });
  const out = clusters.map((c,i)=>{
    const freq = {};
    c.kw.forEach(w=>{ freq[w] = (freq[w]||0)+1; });
    const top = Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,2);
    return { category: top.length? top.map(w=>w[0].toUpperCase()+w.slice(1)).join(' & ') : `Group ${i+1}`, items: c.items };
  });
  const emptyOnes = items.filter(it=>it.text.length===0);
  if(emptyOnes.length) out.push({category:'No text found', items: emptyOnes});
  return out;
}

function renderResults(){
  resultsEl.innerHTML = '';
  if(!groups || !groups.length){
    resultsEl.innerHTML = '<div class="empty">No results yet.</div>';
    return;
  }
  groups.forEach(g=>{
    const sec = document.createElement('div');
    sec.className = 'cat';
    sec.innerHTML = `<h2>${escapeHtml(g.category)} <span class="n">${g.items.length}</span></h2>`;
    g.items.forEach(it=>{
      const e = document.createElement('div');
      e.className = 'entry';
      e.innerHTML = `<div class="fname">${escapeHtml(it.filename)}</div>
        <textarea rows="3">${escapeHtml(it.text || '(nothing found in this photo – try a closer, sharper, well-lit shot)')}</textarea>`;
      sec.appendChild(e);
    });
    resultsEl.appendChild(sec);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function assembleText(){
  if(!groups) return '';
  // pull current textarea values in DOM order in case user edited
  let out = '';
  const cats = resultsEl.querySelectorAll('.cat');
  cats.forEach(catEl=>{
    const title = catEl.querySelector('h2').firstChild.textContent.trim();
    out += `## ${title}\n\n`;
    catEl.querySelectorAll('.entry').forEach(entry=>{
      const fname = entry.querySelector('.fname').textContent;
      const text = entry.querySelector('textarea').value;
      out += `[${fname}]\n${text}\n\n`;
    });
  });
  return out.trim() + '\n';
}

copyBtn.addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText(assembleText());
    toast('Copied — paste it anywhere, including on your PC.');
  }catch(e){
    toast('Could not copy — try Save instead.');
  }
});

saveBtn.addEventListener('click', async ()=>{
  const text = assembleText();
  let downloads = null;
  try{ downloads = await claude.use('downloads'); }catch(e){ downloads = null; }
  if(downloads){
    try{
      await downloads.save({ filename: 'scanned-text.txt', data: text });
      toast('Saved. Grab it from your downloads and move it to your PC.');
      return;
    }catch(e){ /* fall through */ }
  }
  // fallback: plain browser download
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scanned-text.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Downloaded scanned-text.txt');
});
</script>
